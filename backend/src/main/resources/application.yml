# Shared defaults. Profile-specific documents below override these values.
# Secrets have no defaults on purpose: the application refuses to start without the ones the
# active profile and mail provider need.
spring:
  application:
    name: team-analyzer
  profiles:
    # Local development talks to the MySQL instance from docker/docker-compose.yml.
    default: mysql
  datasource:
    hikari:
      # Small pool: serverless containers and managed databases (e.g. TiDB Cloud) limit connections.
      maximum-pool-size: ${MYSQL_POOL_SIZE:5}
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  http:
    clients:
      # Outgoing HTTP calls (e.g. the Brevo mail API) must never block a request indefinitely.
      connect-timeout: 5s
      read-timeout: 10s
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  auth:
    issuer: "teamanalyzer"
    # The account with this email receives the ADMIN role once its address is verified
    # (first-admin bootstrap). Verification links are bound to the password chosen at registration.
    bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    # Prints verification and password-reset links to the log. Local demos only.
    log-verification-link: ${LOG_VERIFICATION_LINK:false}
    email-verify-ttl: 60m
    hmac-secret: "${EMAIL_VERIFY_HMAC_SECRET}"
  frontend-base-url: "${APP_FRONTEND_BASE_URL:http://localhost:5173}"
  verify-endpoint-path: "/verify"
  download-token-secret: "${DOWNLOAD_TOKEN_HMAC_SECRET}"
  cors:
    # Only needed when the frontend calls the API from another origin. Same-origin setups
    # (nginx, Vite proxy, Vercel rewrites) pass the browser's host through instead.
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:${APP_FRONTEND_BASE_URL:http://localhost:5173}}"
  jwt:
    secret: ${APP_JWT_SECRET_BASE64}
  demo:
    # Public "try it" workspaces (seeded team, survey and responses, deleted after 24 hours).
    # While off, demo accounts cannot sign in or refresh; expired workspaces are still deleted.
    enabled: ${APP_DEMO_ENABLED:false}
    cleanup-interval-ms: ${APP_DEMO_CLEANUP_INTERVAL_MS:3600000}
    # Limits for anonymous visitors (see docs/VERCEL_DEPLOYMENT.md, "Demo workspaces").
    # Demo starts per client address and hour, kept in memory by each API instance ...
    max-sessions-per-address-per-hour: ${APP_DEMO_MAX_SESSIONS_PER_ADDRESS_PER_HOUR:20}
    # ... for at most this many addresses (the least recently seen one is forgotten first).
    tracked-addresses: ${APP_DEMO_TRACKED_ADDRESSES:10000}
    # Counted in the database, across all instances:
    max-sessions-per-hour: ${APP_DEMO_MAX_SESSIONS_PER_HOUR:100}
    max-live-workspaces: ${APP_DEMO_MAX_LIVE_WORKSPACES:300}
    # Per workspace: surveys (the seeded one included) and participation links per survey.
    max-surveys-per-workspace: ${APP_DEMO_MAX_SURVEYS_PER_WORKSPACE:10}
    max-tokens-per-survey: ${APP_DEMO_MAX_TOKENS_PER_SURVEY:20}
  mail:
    # Without a mail server, outgoing messages are skipped and only logged (without links).
    enabled: false
    from: ${SPRING_MAIL_FROM:}
  cookies:
    secure: false

logging:
  level:
    root: INFO
    "[com.teamanalyzer]": INFO

---
# Local development and the Docker Compose stack.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:teambase}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

---
# Production: TLS to the database, real mail delivery (Brevo API or SMTP), secure cookies.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # MYSQL_* takes precedence; TIDB_* names are accepted for TiDB Cloud.
    url: "jdbc:mysql://${MYSQL_HOST:${TIDB_HOST:localhost}}:${MYSQL_PORT:${TIDB_PORT:4000}}/${MYSQL_DATABASE:${TIDB_DATABASE:teambase}}?sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC"
    username: "${MYSQL_USER:${TIDB_USER}}"
    password: "${MYSQL_PASSWORD:${TIDB_PASSWORD}}"
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: "${SPRING_MAIL_USERNAME:}"
    password: "${SPRING_MAIL_PASSWORD:}"
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  forward-headers-strategy: framework

management:
  health:
    mail:
      # The SMTP login check would report DOWN whenever mail goes through the Brevo API
      # (no SMTP credentials). Delivery problems surface when a message is sent instead.
      enabled: false

app:
  mail:
    enabled: true
    # brevo-api (HTTPS API, default) or smtp (uses spring.mail.*)
    provider: ${APP_MAIL_PROVIDER:brevo-api}
    api-key: ${BREVO_API_KEY:}
    # Required for both providers; the mail adapters refuse to start without it.
    from: "${SPRING_MAIL_FROM:}"
    from-name: "${SPRING_MAIL_FROM_NAME:Team Analyzer}"
  cookies:
    secure: true

logging:
  level:
    "[org.springframework.security]": WARN

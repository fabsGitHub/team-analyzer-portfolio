spring:
  datasource:
    url: jdbc:tc:mysql:8.4.6:///teambase
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false
    validate-migration-naming: true

  mail:
    host: smtp.example.com
    port: 587
    username: test@example.invalid
    password: test-only-placeholder
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

app:
  frontend-base-url: "http://localhost:5173"
  verify-endpoint-path: "/verify"

  download-token-secret: test-only-placeholder

  # aus dem Dokument
  auth:
    issuer: "test-issuer"
    email-verify-exp-ttl: 24
    hmac-secret: test-only-placeholder
    jwt-access-ttl: 15m
    jwt-refresh-ttl: 14d
    verification-base-url: http://localhost

  # zusätzliche Testwerte
  hmac-secret: test-only-placeholder

  jwt:
    secret: test-only-placeholder
    expiration: 3600000

logging:
  level:
    org.springframework.security: DEBUG
    com.teamanalyzer: DEBUG

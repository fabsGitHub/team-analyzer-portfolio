# Test fixtures only. Signing secrets are generated per test JVM by TestSigningSecrets
# (registered in META-INF/spring.factories), so no key material is committed.
spring:
  datasource:
    # Testcontainers starts a throwaway MySQL server for the test run.
    # UTC like the real datasources, so results do not depend on the developer machine's time zone.
    url: jdbc:tc:mysql:8.4.6:///teambase?serverTimezone=UTC
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

app:
  frontend-base-url: "http://localhost:5173"
  auth:
    issuer: "test-issuer"
    email-verify-ttl: 24m

logging:
  level:
    "[com.teamanalyzer]": DEBUG

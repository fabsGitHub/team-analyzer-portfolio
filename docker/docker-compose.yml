# Local development stack. All published ports are bound to 127.0.0.1.
#
#   docker compose --env-file .env.production -f docker/docker-compose.yml up --build
#
# Optional tooling (phpMyAdmin, SonarQube) lives in docker-compose.tools.yml:
#
#   docker compose --env-file .env.production -f docker/docker-compose.yml -f docker/docker-compose.tools.yml up --build
name: team-analyzer

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # No binary log: it is not needed locally and would keep, for 30 days, which participation
    # token was redeemed in the same transaction as which (otherwise anonymous) survey response.
    command: ["--disable-log-bin"]
    environment:
      MYSQL_DATABASE: teambase
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    # Only the values the API needs are passed in; database root and tool passwords stay out.
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: db
      MYSQL_DATABASE: teambase
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?Set APP_JWT_SECRET_BASE64 in .env.production}
      EMAIL_VERIFY_HMAC_SECRET: ${EMAIL_VERIFY_HMAC_SECRET:?Set EMAIL_VERIFY_HMAC_SECRET in .env.production}
      DOWNLOAD_TOKEN_HMAC_SECRET: ${DOWNLOAD_TOKEN_HMAC_SECRET:?Set DOWNLOAD_TOKEN_HMAC_SECRET in .env.production}
      LOG_VERIFICATION_LINK: ${LOG_VERIFICATION_LINK:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  dbdata:

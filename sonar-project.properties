# SonarQube analysis for the whole repository (backend + frontend).
# Run the scanner from the repository root; set SONAR_HOST_URL and SONAR_TOKEN in the environment.
sonar.projectKey=teamanalyzer
sonar.projectName=Team Analyzer
sonar.projectVersion=0.1.0

# Sources and tests
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/cypress
sonar.test.inclusions=**/*Test.java,**/*.cy.ts
sonar.exclusions=**/node_modules/**,frontend/dist/**,**/*.d.ts,**/db/migration/**

# Java (run `./mvnw verify` in backend/ first to produce classes and the JaCoCo report)
sonar.java.binaries=backend/target/classes
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json
